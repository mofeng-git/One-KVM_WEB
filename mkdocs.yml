site_name: One-KVM 文档
site_description: One-KVM 文档
site_author: SilentWind
site_url: https://docs.one-kvm.cn/

docs_dir: docs

theme:
  name: material
  language: zh
  logo: img/favicon.png
  favicon: img/favicon.png
  palette:
    - scheme: default
      primary: white
      accent: zinc
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: black
      accent: zinc
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.highlight
    - search.share
    - search.suggest
    - navigation.expand
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

repo_url: https://github.com/mofeng-git/One-KVM
repo_name: mofeng-git/One-KVM

copyright: Copyright &copy; 2023 - 2026 SilentWind<br> ICP 备案号：<a href="https://beian.miit.gov.cn/" target="_blank">赣ICP备2025068931号-1</a> &emsp; <img src="/img/beian.png" alt="公安备案" width="12" height="12"> 赣公网安备36092202000251号

extra_css:
  - 'stylesheets/rustdesk-config-modal.css'

extra_javascript:
  - 'baidu-tongji.js'
  - 'javascripts/rustdesk-config-modal.js'

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mofeng-git/One-KVM
  generator: false

plugins:
  - search:
      lang:
        - zh
        - en
  - mkdocs-video:
      video_controls: True
      video_autoplay: false
      is_video: True
